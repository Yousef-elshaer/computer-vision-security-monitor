[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower-vision"
version = "0.1.0"
description = "Local webcam security monitoring with a FastAPI dashboard and SMS alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "numpy>=2.0,<3.0",
  "opencv-python>=4.10,<5.0",
  "python-dotenv>=1.0,<2.0",
  "twilio>=9.0,<10.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9.0"]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.js", "static/*.css", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

